# Application name
spring.application.name=blood_plus
spring.config.import=optional:dotenv:
spring.task.scheduling.enabled=true

# --- DATABASE ---
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:blood_plus}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- MAIL SETTINGS ---
brevo.api.key=${BREVO_API}
app.mail.from=${EMAIL}


cloudinary.cloud-name=${CLOUDINARY-CLOUD-NAME}
cloudinary.api-key=${CLOUDINARY-API-KEY}
cloudinary.api-secret=${CLOUDINARY-API-SECRET}


# --- SERVER ---
server.port=${PORT:8080}    
server.address=0.0.0.0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
